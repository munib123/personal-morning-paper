# CI (L0): typecheck, lint, unit tests and build on every push and pull request (ARCHITECTURE §13).
# No GEMINI_API_KEY: CI never spends the shared free-tier quota. The Supabase env is a placeholder,
# so the build and the stub pages must work without a real project.
# Lane workflows (ingest.yml, editions.yml) map secrets.SUPABASE_URL → NEXT_PUBLIC_SUPABASE_URL (§9.7).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
      SUPABASE_SECRET_KEY: sb_secret_placeholder
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
